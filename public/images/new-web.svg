<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A new web">
  <style>
    rect.bg { fill: var(--papyrus-bg, #eff1f5); }
    text { fill: var(--papyrus-fg, #4c4f69); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .brand { fill: var(--papyrus-accent, #7287fd); font-size: 38px; font-weight: 700; }
    .brand-mark { fill: var(--papyrus-accent, #7287fd); }
    .title { font-size: 62px; font-weight: 800; letter-spacing: 0; }
    .desc { fill: var(--papyrus-muted, #6c6f85); font-size: 30px; }
  </style>
  <rect class="bg" width="1200" height="630" rx="0"/>
  <text x="72" y="120" class="brand">~ $</text>
  <text x="72" y="190" class="title">A new web</text>
  <text x="72" y="470" class="desc">What I used to build my new personal website.</text>
</svg>
