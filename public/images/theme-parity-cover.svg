<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Paper Pure feature pass">
  <style>
    rect.bg { fill: var(--paper-bg, #fcfcfd); }
    rect.panel { fill: var(--paper-panel, #f4f4f5); }
    text { fill: var(--paper-fg, #18181b); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .brand { fill: var(--paper-accent, #2563eb); font-size: 38px; font-weight: 700; }
    .title { font-size: 62px; font-weight: 800; letter-spacing: 0; }
    .desc { fill: var(--paper-muted, #71717a); font-size: 30px; }
  </style>
  <rect class="bg" width="1200" height="630" rx="0"/>
  <rect class="panel" x="48" y="48" width="1104" height="534" rx="28"/>
  <text x="72" y="120" class="brand">~ $</text>
  <text x="72" y="190" class="title">Paper Pure feature pass</text>
  <text x="72" y="520" class="desc">A small demo post showing the blog features that now live in the reusable theme package.</text>
