[site]
title = "Marcelo Félix"
home_title = "hello, world"
description = "Hey, I’m Marcelo. Welcome to my corner of the web, where I write about telecom, Linux, automation, and a few side interests along the way."
url = "https://marcelofelix.com"
lang = "en"
dir = "ltr"
timezone = "Europe/Lisbon"

[brand]
title = "~ $"
mark = "terminal"
show_title = false

[theme]
profile = "catppuccin"
font_profile = "code"

[profile.images]
effect = "tritone"

[source]
repo = "marcelofpfelix/marcelofelix"

[pages.about]
content = """
Hey, I’m Marcelo Félix.

I build and operate software, mostly around telecom, Linux, automation, and infrastructure. I’m interested in systems that are practical, observable, and understandable when something breaks.

This site is where I keep notes from that work: technical write-ups, project logs, experiments, and occasional posts about side interests outside the usual engineering lane.
"""

